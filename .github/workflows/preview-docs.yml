name: preview-docs

on: pull_request

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if ! OUTPUT=$(fern generate --docs --preview 2>&1); then echo "$OUTPUT"; exit 1; fi
          echo "$OUTPUT"
          # A layout key that no longer matches a spec tag is only a warning to Fern.
          if grep -q 'Failed to locate API section' <<<"$OUTPUT"; then exit 1; fi
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()' | head -n1)
          echo "Preview URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🌿 Preview your docs: $URL" > preview_url.txt

      - name: Verify preview against the checked-in OpenAPI input
        env:
          PREVIEW_URL: ${{ steps.generate-docs.outputs.url }}
        run: scripts/check-docs-site.sh "$PREVIEW_URL"

      - name: Comment URL in PR
        if: always() && steps.generate-docs.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- fern-preview-docs -->"
          {
            cat preview_url.txt
            printf '\n%s\n' "$MARKER"
          } > comment-with-marker.md

          # Upsert by looking up an existing comment that carries our hidden marker.
          EXISTING_ID=$(gh api --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")

          jq -Rn --rawfile body comment-with-marker.md '{body: $body}' > payload.json

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_ID" --input payload.json
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input payload.json
          fi
