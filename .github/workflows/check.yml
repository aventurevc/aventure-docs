name: fern-check
run-name: ${{ github.event_name == 'workflow_dispatch' && format('fern-check {0}', inputs.source_sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA of the delivered docs commit to check
        required: true
        type: string
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "fern/**"
      - "openapi/**"
      - "packages/api-schemas/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "fern/**"
      - "openapi/**"
      - "packages/api-schemas/**"
      - "scripts/**"

env:
  SOURCE_SHA: ${{ inputs.source_sha }}

# The public release train waits on each pushed commit's own run, so push and
# dispatch runs never share a group; a newer pull request run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate the requested commit SHA
        if: github.event_name == 'workflow_dispatch'
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify the requested commit
        if: github.event_name == 'workflow_dispatch'
        run: '[ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check documented Bash examples
        run: scripts/check-docs-site.sh

      # publish-docs validates this same commit on pushes before publication.
      - name: Install the configured Fern CLI
        if: github.event_name == 'pull_request'
        run: npm install -g "fern-api@$(node -p 'require("./fern/fern.config.json").version')"

      - name: Check API is valid
        if: github.event_name == 'pull_request'
        run: fern check
