name: publish-docs

on:
  push:
    branches:
      - main
    # Only docs release inputs select a publication.
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "fern/**"
      - "openapi/**"
      - "packages/api-schemas/**"
      - "scripts/**"

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install the configured Fern CLI
        run: npm install -g "fern-api@$(node -p 'require("./fern/fern.config.json").version')"

      - name: Validate the same commit before publishing
        run: fern check

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/fern-ledger-response.mjs
        run: |
          set -eo pipefail
          # Raw DEBUG includes token fragments; retain only the ledger's bounded identity messages.
          fern generate --docs --log-level debug 2>&1 | python3 -u -c '
          import re, sys
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          ledger = re.compile(
              r"\[ledger\] (?:Registered in [0-9]+ms — hash=[0-9a-f]{64}, missing=[0-9]+ blobs|"
              r"Upload complete in [0-9]+ms — [0-9]+ uploaded, [0-9]+ already in store|"
              r"Finished in [0-9]+ms — deploymentId=[A-Za-z0-9_-]+, reused=(?:true|false)|"
              r"All content already in CAS — no uploads needed)$")
          key = r"(?:deploymentId|siteId|deploymentHash|reusedDeployment|additionalSiteIds|translationsProcessed|missingContent|defined|code|status|message|data)"
          keys = rf"(?:none|{key}(?:,{key})*)"
          code = r"(?:absent|other|BAD_REQUEST|UNAUTHORIZED|FORBIDDEN|NOT_FOUND|METHOD_NOT_SUPPORTED|NOT_ACCEPTABLE|TIMEOUT|CONFLICT|PRECONDITION_FAILED|PAYLOAD_TOO_LARGE|UNSUPPORTED_MEDIA_TYPE|UNPROCESSABLE_CONTENT|TOO_MANY_REQUESTS|CLIENT_CLOSED_REQUEST|INTERNAL_SERVER_ERROR|NOT_IMPLEMENTED|BAD_GATEWAY|SERVICE_UNAVAILABLE|GATEWAY_TIMEOUT)"
          body = re.compile(
              r"\[ledger-body\] phase=(?:register|finish) read=(?:started|"
              rf"ok json=(?:object|array|string|number|boolean|null|empty|invalid) keys={keys} otherKeys=[0-9]+ missing={keys} code={code} errorStatus=(?:absent|[1-5][0-9]{{2}}) durationMs=[0-9]+|"
              r"error errorName=(?:Error|TypeError|SyntaxError|AbortError|TimeoutError|other) causeCode=(?:UND_ERR_SOCKET|UND_ERR_BODY_TIMEOUT|UND_ERR_HEADERS_TIMEOUT|UND_ERR_CONNECT_TIMEOUT|UND_ERR_ABORTED|ECONNRESET|ETIMEDOUT|other) durationMs=[0-9]+)")
          for raw in sys.stdin:
              line = ansi.sub("", raw).rstrip()
              match = ledger.search(line)
              if match:
                  print(match.group(0), flush=True)
              elif re.fullmatch(r"\[ledger-response\] phase=(?:register|finish) status=[0-9]{3} contentType=(?:JSON|HTML|other|absent) durationMs=[0-9]+", line):
                  print(line, flush=True)
              elif body.fullmatch(line):
                  print(line, flush=True)
              elif "Cannot parse response body, please check the response body and content-type." in line:
                  print("[ledger-sdk] error=body-parse", flush=True)
              elif "Invalid OpenAPI response format." in line:
                  print("[ledger-sdk] error=response-format", flush=True)
              elif line.endswith("Docs deploy mode: ledger"):
                  print("Docs deploy mode: ledger", flush=True)
              elif "Failed to locate API section" in line:
                  print("Failed to locate API section", flush=True)
          ' | tee "$RUNNER_TEMP/fern-publish.log"
          # A layout key that no longer matches a spec tag is only a warning to Fern.
          if grep -q 'Failed to locate API section' "$RUNNER_TEMP/fern-publish.log"; then exit 1; fi

      - name: Verify the live site against the checked-in OpenAPI input
        # Bounded retry: the edge can serve the previous llms.txt for a short
        # time after publication.
        run: |
          for attempt in 1 2 3 4 5; do
            scripts/check-docs-site.sh https://docs.aventure.vc && exit 0
            [ "$attempt" -lt 5 ] && { echo "attempt $attempt failed; retrying in 60s"; sleep 60; }
          done
          exit 1

      - name: Verify phone navigation on the live site
        uses: ./.github/actions/check-mobile-nav
        with:
          site-url: https://docs.aventure.vc
