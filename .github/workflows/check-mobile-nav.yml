name: check-mobile-nav

# Fern ships renderer changes without a publish from this repository, so the
# live site is rechecked daily as well as after every publish.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: ./.github/actions/check-mobile-nav
        with:
          site-url: https://docs.aventure.vc
