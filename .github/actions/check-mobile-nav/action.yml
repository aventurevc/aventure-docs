name: check-mobile-nav
description: Require working phone navigation on a published docs site (scripts/check-mobile-nav.mjs).
inputs:
  site-url:
    description: Base URL of the published site.
    required: true
runs:
  using: composite
  steps:
    - name: Check phone navigation
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
        PLAYWRIGHT_VERSION: "1.64.0"
      # The image supplies browsers and OS dependencies; only the matching npm
      # package is installed at runtime. Keep both versions on this single pin.
      run: |
        docker run --rm --init --ipc=host \
          -e SITE_URL -e PLAYWRIGHT_VERSION \
          -v "$GITHUB_WORKSPACE/scripts/check-mobile-nav.mjs:/check-mobile-nav.mjs:ro" \
          "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" \
          bash -euc '
            npm install --prefix /tmp/mobile-nav --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
            cp /check-mobile-nav.mjs /tmp/mobile-nav/
            node /tmp/mobile-nav/check-mobile-nav.mjs "$SITE_URL"
          '
