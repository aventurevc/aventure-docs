# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: aventurevc.docs.buildwithfern.com
    custom-domain: docs.aventure.vc
    edit-this-page:
      github:
        owner: fern-starter
        repo: aventure-62whg0m9
        branch: main
      launch: dashboard
title: aVenture | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Docs
    icon: home
  API Reference:
    display-name: API Reference
    icon: puzzle
navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Edit your docs
            path: docs/pages/editing-your-docs.mdx
            icon: fa-duotone fa-pen-to-square
          - page: Write content
            path: docs/pages/writing-content.mdx
            icon: fa-duotone fa-file-lines
          - page: Set up navigation
            path: docs/pages/navigation.mdx
            icon: fa-duotone fa-sitemap
          - page: Customize your docs
            path: docs/pages/customization.mdx
            icon: fa-duotone fa-palette
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
      - section: Changelog
        contents:
          - changelog: docs/changelog
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: API reference
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      - api: aVenture API
        flattened: false
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#0A2540"
    dark: "#FFFFFF"
  background:
    light: "#F8F8F9"
    dark: "#0A2540"
  border:
    light: "#C9CBCC"
    dark: "#26282A"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.png
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
