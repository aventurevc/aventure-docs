# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: aventurevc.docs.buildwithfern.com
    custom-domain: docs.aventure.vc
    edit-this-page:
      github:
        owner: aventurevc
        repo: aventure-docs
        branch: main
      launch: dashboard
title: aVenture | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Docs
    icon: home
  API Reference:
    display-name: API Reference
    icon: puzzle
navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Quickstart
            path: docs/pages/quickstart.mdx
            icon: fa-duotone fa-bolt
          - page: Authentication
            path: docs/pages/authentication.mdx
            icon: fa-duotone fa-key
          - page: Pagination and filtering
            path: docs/pages/pagination-and-filtering.mdx
            icon: fa-duotone fa-filter
          - page: Errors
            path: docs/pages/errors.mdx
            icon: fa-duotone fa-triangle-exclamation
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
      - section: Changelog
        contents:
          - changelog: docs/changelog
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: API reference
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      - api: aVenture API
        flattened: false
navbar-links:
  - type: filled
    text: API reference
    url: https://docs.aventure.vc/api-reference
colors:
  accent-primary:
    light: "#0A2540"
    dark: "#FFFFFF"
  background:
    light: "#F8F8F9"
    dark: "#0A2540"
  border:
    light: "#C9CBCC"
    dark: "#26282A"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 20
  href: https://aventure.vc
favicon: docs/assets/favicon.png
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}

redirects:
  - source: "/editing-your-docs"
    destination: "/quickstart"
  - source: "/writing-content"
    destination: "/quickstart"
  - source: "/navigation"
    destination: "/pagination-and-filtering"
  - source: "/customization"
    destination: "/api-reference"
  - source: "/09-01-2025"
    destination: "/docs/changelog/changelog"
  - source: "/09-15-2025"
    destination: "/docs/changelog/changelog"
  - source: "/10-01-2025"
    destination: "/docs/changelog/changelog"
  - source: "/10-15-2025"
    destination: "/docs/changelog/changelog"
  - source: "/10-29-2025"
    destination: "/docs/changelog/changelog"
