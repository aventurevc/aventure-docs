# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: aventurevc.docs.buildwithfern.com
    custom-domain: docs.aventure.vc
title: aVenture Developer Docs
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Docs
  API Reference:
    display-name: API Reference
    slug: api-reference
navigation:
  - tab: home
    layout:
      - section: Get Started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
          - page: AI Apps (MCP)
            path: docs/pages/mcp-quickstart.mdx
          - page: Terminal (CLI)
            path: docs/pages/cli-quickstart.mdx
          - page: Your Code (API)
            path: docs/pages/quickstart.mdx
      - section: Use Cases & Examples
        contents:
          - page: Use Cases and Examples
            path: docs/pages/use-cases.mdx
      - section: Guides
        contents:
          - page: Answer a Real Question
            path: docs/pages/first-answer.mdx
          - section: Identify Records
            collapsed: true
            contents:
              - page: Identify a Company or Person
                path: docs/pages/lookup.mdx
              - page: Identify Names in an Article
                path: docs/pages/lookup-articles.mdx
              - page: Identify a List of Names
                path: docs/pages/lookup-jobs.mdx
              - page: Update Records With Research
                path: docs/pages/research-updates.mdx
          - page: Company Brand Lookup
            path: docs/pages/company-brand-lookup.mdx
          - page: News Alerts
            path: docs/pages/news-alerts.mdx
          - page: Call MCP Tools Directly
            path: docs/pages/mcp-tools.mdx
      - section: Reference
        contents:
          - page: Authentication
            path: docs/pages/authentication.mdx
          - page: Plans and Usage
            path: docs/pages/plans-and-usage.mdx
          - page: Pagination and Filtering
            path: docs/pages/pagination-and-filtering.mdx
          - page: Asynchronous Requests
            path: docs/pages/async-requests.mdx
          - page: Errors
            path: docs/pages/errors.mdx
          - page: Support
            path: docs/pages/support.mdx
      - section: Changelog
        contents:
          - changelog: docs/changelog
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: API Reference
            path: docs/pages/api-reference-overview.mdx
      - api: aVenture API
        flattened: false
        skip-slug: true
        # Sections group tags by task and skip their slug, so endpoint URLs stay
        # /api-reference/<tag>/<endpoint>. The endpoint overrides disambiguate
        # pages while preserving their published URLs.
        layout:
          - section: Companies
            skip-slug: true
            contents:
              - entities:
                  - endpoint: POST /v1/entities/lookup-batch
                    slug: lookup-entity-batch
                  - endpoint: POST /v1/entities/lookup-matches
                    slug: lookup-entity-matches
              - entityFilters:
                  - endpoint: GET /v1/entities/filters
                    slug: list-entity-filter-options
              - entityFundraise
              - entityPersonAssociations
              - entityRelationships
              - entityAcquisitions
              - entityClassifications
              - entityAddresses
              - entityMedia
              - entityResearch
              - entitySimilar
              - entityMaintenance
          - section: People
            skip-slug: true
            contents:
              - people:
                  - endpoint: POST /v1/people/lookup-batch
                    slug: lookup-person-batch
              - personInvestments
              - personMetadata
              - personAddresses
              - personMedia
          - section: News and Content
            skip-slug: true
            contents:
              - news
              - newsMedia
              - publications
              - researchBlogPosts
              - texts
              - urlLinks
              - repositories
          - section: Search and Identify
            skip-slug: true
            contents:
              - search
              - naturalSearch
              - semanticSimilarity:
                  - endpoint: GET /v1/entities/{entityId}/trending-news
                    slug: list-entity-trending-news
                    title: Get Trending News for an Entity by UUID
              - identifiers
              - recordSlugs
              - classificationTags
              - section: Resolve
                slug: resolve
                contents:
                  - endpoint: GET /v1/resolve/{token}
                    slug: resolve-identifier
          - section: Account and Billing
            skip-slug: true
            contents:
              - auth
              - billing
          - section: Agents and System
            skip-slug: true
            contents:
              - agents
              - harness
              - system

navbar-links:
  - type: filled
    text: Get an API key
    url: https://aventure.vc/settings/api-keys
# Brand tokens from aventure.vc (front-end src/styles/themeColors.ts, surfaceTheme.css).
colors:
  accent-primary:
    light: "#134E88"
    dark: "#F9B25B"
  background:
    light: "#FBFBFB"
    dark: "#0A2540"
  border:
    light: "#CCD2E3"
    dark: "#3A5470"
  sidebar-background:
    light: "#F0F2F5"
    dark: "#071C31"
  header-background:
    light: "#FBFBFB"
    dark: "#071C31"
  card-background:
    light: "#F0F2F5"
    dark: "#12304F"
theme:
  sidebar: minimal
  page-actions: toolbar
  footer-nav: minimal
# Keep only page copy and export; Ask AI lives in the header, and the
# Claude Code and Cursor buttons install the docs-search MCP, which readers
# confuse with the aVenture data MCP. Install skills opens the command for
# the agent skills served from /.well-known/agent-skills/.
page-actions:
  options:
    ask-ai: false
    claude-code: false
    cursor: false
    skills: {}
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 20
  href: https://aventure.vc
favicon: docs/assets/favicon.png
css:
  - styles.css
js:
  - path: native-back-button.js
    strategy: beforeInteractive
typography:
  headingsFont:
    name: Crimson Pro
    paths:
      - path: docs/assets/fonts/CrimsonPro-Variable.woff2
        weight: 200 900
        style: normal
  bodyFont:
    name: Archivo
    paths:
      - path: docs/assets/fonts/Archivo-Variable.woff2
        weight: 100 900
        style: normal
  codeFont:
    name: JetBrains Mono
    paths:
      - path: docs/assets/fonts/JetBrainsMono-Variable.woff2
        weight: 400 800
        style: normal
settings:
  dark-mode-code: true
ai-search: {}
agents:
  llms-txt: ./llms.txt

redirects:
  # Stable address for the byte-exact released specification. The <Download> on
  # the API reference overview pins one release; this path always serves the
  # current one, so a consumer or API catalog can bookmark it.
  - source: "/openapi/latest.json"
    destination: "https://raw.githubusercontent.com/aventurevc/aventure-docs/main/openapi/openapi.json"
  # skip-slug on the API entry removed the title-derived a-venture-api segment.
  - source: "/api-reference/a-venture-api"
    destination: "/api-reference"
  - source: "/api-reference/a-venture-api/:slug*"
    destination: "/api-reference/:slug*"
  # The identicon endpoint is private (x-aventure-visibility scope private) and
  # left the public spec; its generated page survives here as a redirect.
  - source: "/api-reference/media/get-generated-monogram"
    destination: "/api-reference"
  - source: "/editing-your-docs"
    destination: "/quickstart"
  - source: "/writing-content"
    destination: "/quickstart"
  - source: "/navigation"
    destination: "/pagination-and-filtering"
  - source: "/customization"
    destination: "/api-reference"
  - source: "/09-01-2025"
    destination: "/docs/changelog/changelog"
  - source: "/09-15-2025"
    destination: "/docs/changelog/changelog"
  - source: "/10-01-2025"
    destination: "/docs/changelog/changelog"
  - source: "/10-15-2025"
    destination: "/docs/changelog/changelog"
  - source: "/10-29-2025"
    destination: "/docs/changelog/changelog"
